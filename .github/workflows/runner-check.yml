
name: Runner Environment Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  EXPECTED_NODE_MAJOR: "22"
  EXPECTED_PYTHON_MINOR: "3.12"
  EXPECTED_VAULT_VERSION: "2.2.2"

jobs:
  validate-runner:
    name: Validate Standardized Self-Hosted Runner
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate installed tools
        run: ./scripts/validate-tools.sh
