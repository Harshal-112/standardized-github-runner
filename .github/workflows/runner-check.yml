
name: Runner Environment Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  EXPECTED_NODE_MAJOR: "99"
  EXPECTED_PYTHON_MINOR: "3.12"

jobs:
  validate-runner:
    name: Validate Required Tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tool validation
        run: ./scripts/validate-tools.sh
