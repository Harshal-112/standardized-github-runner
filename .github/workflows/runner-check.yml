
name: Runner Environment Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-runner:
    name: Validate Standardized Self-Hosted Runner
    runs-on: [self-hosted, linux, x64, ubuntu-24.04, standardized]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate installed tools
        run: ./scripts/validate-tools.sh
